const filtros = {sup:'todos', localidad:'todas', chofer:'todos', q:''};

const sups = ['todos', ...new Set(DATA.map(c=>c.sup))];
const locs = ['todas', ...new Set(DATA.map(c=>c.localidad))];
const chfs = ['todos', ...new Set(DATA.map(c=>c.chofer))].sort();

function renderFiltros(){
  const f = document.getElementById('filters');
  const grupos = [
    {key:'sup', label:'Sup', opts:sups},
    {key:'localidad', label:'Loc', opts:locs},
    {key:'chofer', label:'Chofer', opts:chfs},
  ];
  let html = '';
  grupos.forEach(g=>{
    g.opts.forEach(o=>{
      const active = filtros[g.key]===o?'active':'';
      const lbl = o==='todos'||o==='todas' ? g.label+': todos' : o;
      html += `<button class="chip ${active}" data-k="${g.key}" data-v="${o}">${lbl}</button>`;
    });
  });
  f.innerHTML = html;
  f.querySelectorAll('.chip').forEach(b=>{
    b.onclick=()=>{filtros[b.dataset.k]=b.dataset.v;renderFiltros();render();};
  });
}

function catBadge(cat){
  if(!cat) return '';
  const k = cat.toLowerCase();
  const cls = k.includes('detr')?'detr':k.includes('pas')?'pas':k.includes('prom')?'prom':'cat';
  return `<span class="badge ${cls}">${cat}</span>`;
}

function render(){
  const q = filtros.q.toLowerCase().trim();
  const filt = DATA.filter(c=>{
    if(filtros.sup!=='todos' && c.sup!==filtros.sup) return false;
    if(filtros.localidad!=='todas' && c.localidad!==filtros.localidad) return false;
    if(filtros.chofer!=='todos' && c.chofer!==filtros.chofer) return false;
    if(q){
      const s = (c.razon+' '+c.dir+' '+c.chofer+' '+c.vendedor+' '+c.localidad+' '+c.cod).toLowerCase();
      if(!s.includes(q)) return false;
    }
    return true;
  });
  document.getElementById('stats').innerHTML = `<b>${filt.length}</b> de ${DATA.length} clientes`;
  const list = document.getElementById('list');
  if(!filt.length){ list.innerHTML = '<div class="empty">Sin resultados</div>'; return; }
  list.innerHTML = filt.map(c=>{
    const puntBadge = c.punt!=null ? `<span class="badge punt">⭐ ${c.punt.toFixed(1)}</span>` : '';
    const url = `https://www.google.com/maps/dir/?api=1&destination=${c.lat},${c.lon}&travelmode=driving`;
    return `
    <div class="card">
      <div class="card-top">
        <div class="razon">${c.razon}</div>
        <div class="cod">#${c.cod}</div>
      </div>
      <div class="dir">📍 ${c.dir}</div>
      <div class="loc">${c.localidad} · ${c.horario}</div>
      <div class="badges">${catBadge(c.cat)}${puntBadge}<span class="badge cat">${c.canal}</span></div>
      <div class="meta">
        <div><span>Chofer</span>${c.chofer} (#${c.nchofer})</div>
        <div><span>Supervisor</span>${c.sup}</div>
        <div style="grid-column:1/-1"><span>Vendedor</span>${c.vendedor}</div>
      </div>
      <div class="actions">
        <a class="btn go" href="${url}" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24"><path d="M12 2L4.5 20.29l.71.71L12 18l6.79 3 .71-.71z"/></svg>
          Ir con Maps
        </a>
        <a class="btn form" href="${FORM_URL}" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg>
          Cargar Forms
        </a>
      </div>
    </div>`;
  }).join('');
}

document.getElementById('q').oninput = e=>{filtros.q=e.target.value;render();};
renderFiltros();
render();

window.addEventListener('load',()=>{
  const h = document.querySelector('header').offsetHeight;
  document.querySelector('.filters').style.top = h+'px';
});
</script>
